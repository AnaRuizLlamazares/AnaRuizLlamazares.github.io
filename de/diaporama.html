<style>
    :root { --site-nav-offset: 80px; }

    .diaporama-container {
      max-width: 950px;
      margin: calc(var(--site-nav-offset) + 1.2rem) auto 3rem auto;
      padding: 2rem 1.2rem 2.2rem 1.2rem;
      border-radius: 22px;
      text-align: center;
    }

    .diapo-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin: 0 0 1.2rem 0;
      letter-spacing: 0.5px;
    }

    .diapo-gallery {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      margin-bottom: 0.8rem;
    }

    .diapo-stage {
      width: 100%;
      height: min(540px, 62vh);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .diapo-titlecard {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 2.4rem 1.2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      line-height: 1.25;
    }

    .diapo-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      display: block;
      margin: auto;
    }

    .diapo-titlecard[hidden] { display: none; }

    .diapo-caption {
      font-style: italic;
      margin: 1rem 0 1.2rem 0;
      min-height: 1.4em;
    }

    .diapo-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      margin-top: 0.2rem;
    }

    .diapo-btn {
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.5rem;
      border: none;
      cursor: pointer;
    }

    .diapo-pause-btn { font-size: 1.15rem; }

    .diapo-indicator {
      font-size: 0.95rem;
    }

    /* Plein écran : fond noir, image au maximum, commandes en bas, croix en haut à droite.
       Deux modes (voir js/diapo.js) : natif (:fullscreen) ou de repli en position fixe
       (.is-pseudo-fs, Safari iPhone notamment). L'habillage commun est sur .is-fullscreen. */
    .diaporama-container:fullscreen, .diaporama-container:-webkit-full-screen,
    .diaporama-container.is-pseudo-fs {
      max-width: none; margin: 0 !important; padding: 0 !important;
      border-radius: 0; background: #000 !important; color: #f4efe9 !important;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .diaporama-container:fullscreen, .diaporama-container:-webkit-full-screen { position: relative; width: 100vw; height: 100vh; }
    .diaporama-container.is-pseudo-fs {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: auto; z-index: 5000; /* au-dessus de la navbar (3000) */
      height: 100vh; height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px) !important; padding-bottom: env(safe-area-inset-bottom, 0px) !important;
    }
    html.diapo-fs-lock, html.diapo-fs-lock body { overflow: hidden; }
    /* <main> forme un contexte d'empilement (z-index 2) sous la navbar (3000) : en mode
       de repli, la barre de navigation est masquée pour que le diaporama soit seul à l'écran. */
    html.diapo-fs-lock .navbar { display: none !important; }
    .diaporama-container.is-fullscreen .diapo-title { display: none; }
    .diaporama-container.is-fullscreen .diapo-gallery { position: absolute; top: 0; left: 0; right: 0; height: 2.4cm; display: flex; align-items: center; justify-content: center; margin: 0; color: #f4efe9 !important; font-size: 1.15rem; padding: 0 2.4cm; }
    .diaporama-container.is-fullscreen .diapo-stage { height: calc(100% - 4.8cm); flex: 0 0 auto; border-radius: 0; }
    .diaporama-container.is-fullscreen .diapo-img { border-radius: 0; }
    .diaporama-container.is-fullscreen .diapo-titlecard { color: #f4efe9; font-size: 2.2rem; }
    .diaporama-container.is-fullscreen .diapo-caption { position: absolute; bottom: calc(2.4cm - 1.6em); left: 0; right: 0; color: #f4efe9 !important; margin: 0; min-height: 0; line-height: 1.3; }
    .diaporama-container.is-fullscreen .diapo-controls { position: absolute; bottom: 8px; left: 0; right: 0; margin: 0; }
    .diaporama-container.is-fullscreen .diapo-btn { width: 38px; height: 38px; font-size: 1.3rem; }
    .diaporama-container.is-fullscreen .diapo-btn { background: rgba(255,255,255,0.18); color: #fff; }
    .diaporama-container.is-fullscreen .diapo-indicator, .diaporama-container.is-fullscreen .diapo-audio-btn { color: #f4efe9 !important; }
    .diapo-fs-exit { display: none; position: absolute; top: 0.6cm; right: 0.6cm; z-index: 5; border: 0; border-radius: 34px;
      padding: .5rem .9rem; font-size: 1.05rem; line-height: 1; cursor: pointer; background: rgba(255,255,255,0.3); color: #fff; backdrop-filter: blur(4px); }
    .diaporama-container.is-fullscreen .diapo-fs-exit { display: block; }
    .diapo-fs-btn { font-size: 1.35rem; }

    @media (max-width: 700px) {
      .diaporama-container { padding: 1.3rem 0.9rem 1.7rem 0.9rem; }
      .diapo-title { font-size: 1.35rem; }
      .diapo-gallery { font-size: 1.05rem; }
      .diapo-stage { height: min(360px, 50vh); }
    }
